name: Collection portability
on:
  push:
    branches: [main, fix/collection-cross-platform]
  pull_request:
permissions:
  contents: read
jobs:
  collection:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: node --test --test-timeout=30000 "test/collection-*.test.ts" test/unified-events.test.ts
      - run: python -m unittest discover -s test -p test_mediacrawler_local.py
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: python -m pip install -r scripts/requirements-ocr.txt
      - name: Real Python and OCR runtime (no external services)
        run: node scripts/check-collection-runtime.ts --ocr
        env:
          COLLECTION_PYTHON: python
      - if: runner.os != 'Windows'
        name: POSIX cron entry preview
        run: sh scripts/collection-scheduled-task.sh --config configs/collection.scheduled.json
